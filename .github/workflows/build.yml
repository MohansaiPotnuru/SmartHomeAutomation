name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: ESP32 core ${{ matrix.core }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ["2.0.17", "3.1.1"]
    steps:
      - uses: actions/checkout@v5
      - name: Use example secrets
        run: cp secrets.example.h secrets.h
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          libraries: |
            - name: PubSubClient
            - name: MFRC522
            - name: Adafruit BME280 Library
            - name: Adafruit Unified Sensor
            - name: BH1750
            - name: PZEM004Tv30
            - name: Adafruit SSD1306
            - name: Adafruit GFX Library
          sketch-paths: |
            - ./
          enable-warnings-report: true
